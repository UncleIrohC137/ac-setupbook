<title>Assetto Setupbook</title>
<style>
:root{
  --ground:#E9ECEE; --surface:#FFFFFF; --surface-2:#F3F5F6; --surface-3:#E4E9EB;
  --ink:#12191D; --ink-2:#3D4A52; --muted:#6B7A83;
  --rule:#D2D9DC; --rule-strong:#B4BFC5;
  --cool:#17626F; --cool-bg:rgba(23,98,111,.14);
  --warm:#9C6210; --warm-bg:rgba(156,98,16,.15);
  --mid:#5A5C86;  --mid-bg:rgba(90,92,134,.14);
  --out:#9E3350;  --out-bg:rgba(158,51,80,.14);
  --shadow:0 1px 2px rgba(18,25,29,.06),0 8px 24px rgba(18,25,29,.07);
  --display:"Bahnschrift","Bahnschrift Condensed","DIN Alternate",system-ui,sans-serif;
  --body:"Segoe UI","Selawik",system-ui,-apple-system,sans-serif;
  --mono:"Cascadia Mono","Consolas","SF Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#12171A; --surface:#181E22; --surface-2:#1E262A; --surface-3:#263036;
    --ink:#E8EDEF; --ink-2:#B7C2C7; --muted:#849099;
    --rule:#2A3439; --rule-strong:#3B484F;
    --cool:#5DBFD1; --cool-bg:rgba(93,191,209,.17);
    --warm:#D79B45; --warm-bg:rgba(215,155,69,.17);
    --mid:#9B9DD4;  --mid-bg:rgba(155,157,212,.17);
    --out:#E2758F;  --out-bg:rgba(226,117,143,.17);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#12171A; --surface:#181E22; --surface-2:#1E262A; --surface-3:#263036;
  --ink:#E8EDEF; --ink-2:#B7C2C7; --muted:#849099;
  --rule:#2A3439; --rule-strong:#3B484F;
  --cool:#5DBFD1; --cool-bg:rgba(93,191,209,.17);
  --warm:#D79B45; --warm-bg:rgba(215,155,69,.17);
  --mid:#9B9DD4;  --mid-bg:rgba(155,157,212,.17);
  --out:#E2758F;  --out-bg:rgba(226,117,143,.17);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.shell{max-width:1720px; margin:0 auto; padding:26px 22px 70px; display:grid; grid-template-columns:300px minmax(0,1fr); gap:24px; align-items:start}
@media (max-width:960px){ .shell{grid-template-columns:1fr} }

/* ---- masthead ---- */
.masthead{grid-column:1/-1; display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px}
.eyebrow{font-family:var(--display); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--cool); font-weight:600}
h1{font-family:var(--display); font-weight:700; font-size:clamp(28px,3.6vw,42px); line-height:1.02; margin:2px 0 0; letter-spacing:-.01em}
.mast-right{display:flex; flex-direction:column; align-items:flex-end; gap:5px}
.lede{margin:6px 0 0; font-size:14px; color:var(--muted); max-width:62ch}
.stamp{font-family:var(--mono); font-size:12px; color:var(--muted); text-align:right}
.real{color:var(--ink)}
.click{color:var(--muted); font-size:11px; margin-left:5px}
table.build{width:100%; border-collapse:separate; border-spacing:0; font-size:13px}
table.build th{
  font-family:var(--display); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--muted); text-align:left; padding:6px 8px; border-bottom:1px solid var(--rule-strong);
}
table.build td{border-bottom:1px solid var(--rule); padding:4px 8px; vertical-align:middle}
table.build td.b-name{font-size:13px; color:var(--ink-2); white-space:nowrap}
table.build td.b-val{font-family:var(--mono); white-space:nowrap}
table.build td.b-src{font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap; max-width:190px; overflow:hidden; text-overflow:ellipsis}
table.build tr.open td{color:var(--muted)}
table.build tr.open td.b-name{font-style:italic}
.stepper{display:inline-flex; align-items:center; gap:3px}
.stepper button{
  width:22px; height:22px; line-height:1; font-family:var(--mono); font-size:13px; font-weight:700;
  background:var(--surface-2); color:var(--ink); border:1px solid var(--rule-strong); border-radius:2px; cursor:pointer;
}
.stepper button:hover:not(:disabled){background:var(--surface-3)}
.stepper button:disabled{opacity:.3; cursor:default}
.stepper button:focus-visible{outline:2px solid var(--cool); outline-offset:1px}
.stepper input{
  width:64px; font-family:var(--mono); font-size:12.5px; text-align:right; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--rule-strong); border-radius:2px; padding:2px 5px;
}
.stepper input:focus-visible{outline:2px solid var(--cool); outline-offset:1px}
.edited{color:var(--cool); font-weight:600}
.buildwrap{overflow-x:auto; max-height:420px; overflow-y:auto}
ol.ways{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:8px}
ol.ways li{font-size:14px; color:var(--ink-2); max-width:74ch}
ol.ways li b{color:var(--ink); font-weight:600}
ul.files{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:3px}
ul.files li{font-family:var(--mono); font-size:12.5px; color:var(--muted)}
ul.files li b{color:var(--ink-2); font-weight:600}
select.lang{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted); background:transparent; border:1px solid var(--rule-strong);
  border-radius:2px; padding:2px 4px; cursor:pointer;
}
select.lang:hover{color:var(--ink)}
select.lang:focus-visible{outline:2px solid var(--cool); outline-offset:1px}

/* ---- sidebar ---- */
.side{background:var(--surface); border:1px solid var(--rule); border-radius:3px; box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden; position:sticky; top:16px; max-height:calc(100vh - 32px)}
.side-top{padding:12px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--rule)}
input.field, select.field{
  font-family:var(--body); font-size:13.5px; color:var(--ink); background:var(--surface-2);
  border:1px solid var(--rule-strong); border-radius:2px; padding:7px 9px; width:100%;
}
input.field:focus-visible, select.field:focus-visible{outline:2px solid var(--cool); outline-offset:1px}
.viewtabs{display:flex; gap:0; border:1px solid var(--rule-strong); border-radius:2px; overflow:hidden}
.viewtabs button{
  flex:1; font-family:var(--display); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:600;
  background:var(--surface-2); color:var(--ink-2); border:0; border-right:1px solid var(--rule-strong);
  padding:6px 4px; cursor:pointer;
}
.viewtabs button:last-child{border-right:0}
.viewtabs button[aria-pressed="true"]{background:var(--cool); color:var(--surface)}
.viewtabs button:focus-visible{outline:2px solid var(--cool); outline-offset:-2px}
.source{display:flex; flex-direction:column; gap:6px; padding-bottom:9px; border-bottom:1px solid var(--rule)}
.src-line{display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; color:var(--ink-2)}
.src-dot{width:7px; height:7px; border-radius:50%; background:var(--muted); flex:none}
.src-dot.own{background:var(--cool)}
button.src-btn{width:100%; font-size:11.5px; padding:6px 8px}
.src-hint{margin:0; font-size:11.5px; color:var(--muted); line-height:1.4}
.summary{
  font-family:var(--mono); font-size:11.5px; color:var(--muted); line-height:1.45;
  border-top:1px solid var(--rule); padding-top:8px; margin-top:1px;
}
.summary b{color:var(--ink); font-weight:600}
.summary .narrow{color:var(--cool)}
.carlist{overflow-y:auto; flex:1; min-height:0}
.sect{
  font-family:var(--display); font-size:10px; letter-spacing:.16em; text-transform:uppercase; font-weight:700;
  color:var(--muted); background:var(--surface-2); padding:7px 12px; border-bottom:1px solid var(--rule);
  position:sticky; top:0; z-index:1;
}
.sect.note{position:static; background:none; text-transform:none; letter-spacing:0; font-family:var(--body); font-size:12.5px; font-weight:400}
.car{border-bottom:1px solid var(--rule)}
.car-row{display:flex; align-items:stretch}
.pin{
  background:none; border:0; cursor:pointer; padding:0 2px 0 9px;
  color:var(--rule-strong); font-size:14px; line-height:1; display:flex; align-items:center;
}
.pin:hover{color:var(--warm)}
.pin.on{color:var(--warm)}
.pin:focus-visible{outline:2px solid var(--cool); outline-offset:-2px}
.car-head{display:flex; align-items:center; gap:9px; padding:9px 12px 9px 7px; cursor:pointer; background:none; border:0; flex:1; min-width:0; text-align:left; font-family:inherit; color:inherit}
.car-row:hover{background:var(--surface-2)}
.car-head:focus-visible{outline:2px solid var(--cool); outline-offset:-2px}
.car.open .car-row{background:var(--surface-3)}
.car-name{font-size:13.5px; font-weight:600; line-height:1.25; flex:1; min-width:0}
.car-brand{display:block; font-size:11.5px; font-weight:400; color:var(--muted)}
.car-count{font-family:var(--mono); font-size:11.5px; color:var(--muted); flex:none; display:flex; align-items:center; gap:5px}
.car-count .of{color:var(--cool)}
.selbadge{background:var(--cool); color:var(--surface); border-radius:2px; padding:1px 5px; font-weight:700; font-size:10.5px}
.trk-n{float:right; font-family:var(--mono); letter-spacing:0; text-transform:none; font-weight:400}
.car-body{display:none; padding:2px 12px 12px}
.car.open .car-body{display:block}
.trk{font-family:var(--display); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); font-weight:700; margin:9px 0 3px}
label.setup{display:flex; align-items:flex-start; gap:7px; padding:3px 0; font-size:13px; cursor:pointer; line-height:1.35}
label.setup:hover{color:var(--cool)}
label.setup input{margin:3px 0 0; flex:none; accent-color:var(--cool)}
.setup-d{font-family:var(--mono); font-size:10.5px; color:var(--muted); display:block}
.auto-tag{font-size:10px; color:var(--muted); border:1px solid var(--rule-strong); border-radius:2px; padding:0 3px; margin-left:4px}
.samecls{background:none; border:0; padding:0; margin-top:6px; font-family:inherit; font-size:12px; color:var(--cool); cursor:pointer; text-decoration:underline}

/* ---- main column ---- */
.main{display:flex; flex-direction:column; gap:16px; min-width:0}
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:3px; box-shadow:var(--shadow); padding:14px 16px; display:flex; flex-direction:column; gap:12px}
.bar{display:flex; flex-wrap:wrap; align-items:center; gap:9px 16px}
.bar-label{font-family:var(--display); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700}
button.btn, select.btn{
  font-family:var(--display); font-size:12.5px; letter-spacing:.05em; text-transform:uppercase; font-weight:600;
  color:var(--ink); background:var(--surface-2); border:1px solid var(--rule-strong);
  border-radius:2px; padding:6px 11px; cursor:pointer;
}
select.btn{text-transform:none; letter-spacing:0; font-family:var(--body); font-size:13px}
button.btn[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--surface)}
button.btn:focus-visible, select.btn:focus-visible, th.col:focus-visible{outline:2px solid var(--cool); outline-offset:2px}
.hint{font-size:13px; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; background:var(--surface-2); border:1px solid var(--rule-strong); border-radius:2px; padding:3px 4px 3px 8px}
.chip b{font-weight:600}
.chip em{font-style:normal; color:var(--muted); font-family:var(--mono); font-size:11px}
.chip button{background:none; border:0; cursor:pointer; color:var(--muted); font-size:14px; line-height:1; padding:2px 4px}
.chip button:hover{color:var(--out)}
.warn{border-left:2px solid var(--warm); background:var(--warm-bg); padding:9px 12px; font-size:13.5px; border-radius:2px}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:7px; white-space:nowrap}
.swatch{width:22px; height:10px; border-radius:1px; border:1px solid var(--rule-strong); flex:none}
.sw-cool{background:var(--cool-bg); border-color:var(--cool)}
.sw-warm{background:var(--warm-bg); border-color:var(--warm)}
.sw-mid{background:var(--mid-bg); border-color:var(--mid)}
.sw-out{background:var(--out-bg); border-color:var(--out)}
.sw-pick{background:transparent; border:2px solid var(--ink)}

/* ---- table ---- */
.scroller{overflow:auto; max-height:75vh; background:var(--surface); border:1px solid var(--rule); border-radius:3px; box-shadow:var(--shadow)}
table{border-collapse:separate; border-spacing:0; width:100%; font-variant-numeric:tabular-nums}
th,td{padding:0; text-align:left}
thead th{
  position:sticky; top:0; z-index:3; background:var(--surface-2);
  border-bottom:1px solid var(--rule-strong); vertical-align:bottom;
  padding:9px 10px 8px; border-top:3px solid transparent;
}
thead th.col{cursor:pointer; user-select:none}
thead th.col:hover{background:var(--surface-3)}
thead th.refA{border-top-color:var(--cool); background:var(--cool-bg)}
thead th.refB{border-top-color:var(--warm); background:var(--warm-bg)}
thead th.pname{left:0; z-index:4; min-width:210px; border-right:1px solid var(--rule-strong)}
th.pname,td.pname{position:sticky; left:0; background:var(--surface); border-right:1px solid var(--rule)}
.colcar{font-family:var(--display); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); display:block; white-space:nowrap; max-width:190px; overflow:hidden; text-overflow:ellipsis}
.colname{font-family:var(--display); font-size:13.5px; font-weight:600; display:block; white-space:nowrap; max-width:190px; overflow:hidden; text-overflow:ellipsis}
.colmeta{font-family:var(--mono); font-size:10px; color:var(--muted); display:block; margin-top:2px; white-space:nowrap}
.badge{display:inline-block; font-family:var(--display); font-size:9.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; padding:2px 6px; border-radius:2px; margin-bottom:4px}
.badge-a{background:var(--cool); color:var(--surface)}
.badge-b{background:var(--warm); color:var(--surface)}
.badge-ghost{background:transparent; color:transparent; border:1px solid transparent}
tbody td{border-bottom:1px solid var(--rule); padding:6px 10px; font-family:var(--mono); font-size:13px}
tbody td.val{cursor:pointer}
tbody td.val:hover{box-shadow:inset 0 0 0 1px var(--rule-strong)}
tbody td.pname{font-family:var(--body); font-size:13px; color:var(--ink-2); white-space:nowrap; padding-right:16px}
tbody td.na{color:var(--muted); cursor:default}
tbody td.na:hover{box-shadow:none}
tbody tr.grp td{
  background:var(--surface-2); border-bottom:1px solid var(--rule-strong); border-top:1px solid var(--rule-strong);
  font-family:var(--display); font-size:11px; font-weight:700; letter-spacing:.15em; text-transform:uppercase;
  color:var(--muted); padding:8px 10px;
}
tbody tr.grp td.pname{background:var(--surface-2)}
tbody tr:hover td.pname{color:var(--ink)}
td.cool{background:var(--cool-bg); color:var(--cool); font-weight:600}
td.warm{background:var(--warm-bg); color:var(--warm); font-weight:600}
td.mid{background:var(--mid-bg);  color:var(--mid);  font-weight:600}
td.out{background:var(--out-bg);  color:var(--out);  font-weight:700}
td.picked{box-shadow:inset 0 0 0 2px var(--ink)}
td.val:hover.picked{box-shadow:inset 0 0 0 2px var(--ink)}
.empty{padding:44px 20px; text-align:center; color:var(--muted)}
.empty strong{display:block; font-family:var(--display); font-size:19px; color:var(--ink-2); margin-bottom:5px}
pre.ini{
  margin:0; background:var(--surface-2); border:1px solid var(--rule); border-radius:2px;
  padding:13px 15px; overflow:auto; max-height:320px;
  font-family:var(--mono); font-size:12.5px; line-height:1.5; color:var(--ink-2); white-space:pre;
}
.count{font-family:var(--mono); font-size:12.5px; color:var(--muted)}
.count strong{color:var(--ink); font-weight:600}
h2{font-family:var(--display); font-size:18px; margin:0; letter-spacing:.01em}
details.about{background:var(--surface); border:1px solid var(--rule); border-radius:3px; padding:0 16px}
details.about summary{
  font-family:var(--display); font-size:14px; font-weight:600; letter-spacing:.01em;
  padding:12px 0; cursor:pointer; color:var(--ink-2); list-style:none;
}
details.about summary::-webkit-details-marker{display:none}
details.about summary::before{content:"+"; display:inline-block; width:16px; color:var(--cool); font-weight:700}
details.about[open] summary::before{content:"\2212"}
details.about summary:focus-visible{outline:2px solid var(--cool); outline-offset:2px}
details.about ol{margin:0 0 12px; padding:0 0 0 22px; display:flex; flex-direction:column; gap:7px}
details.about li{font-size:14px; color:var(--ink-2); max-width:74ch}
details.about li b{color:var(--ink); font-weight:600}
.about-note{
  margin:0 0 14px; padding:10px 12px; font-size:13.5px; color:var(--ink-2); max-width:74ch;
  border-left:2px solid var(--warm); background:var(--warm-bg); border-radius:2px;
}
</style>

<div class="shell">
  <div class="masthead">
    <div>
      <span class="eyebrow">Assetto Corsa</span>
      <h1 id="h1"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="mast-right">
      <select class="lang" id="lang" aria-label="Language"></select>
      <div class="stamp" id="stamp"></div>
    </div>
  </div>

  <aside class="side">
    <div class="side-top">
      <div class="source">
        <div class="src-line"><span class="src-dot" id="src-dot"></span><span id="src-name"></span></div>
        <button class="btn src-btn" id="loadbtn"></button>
        <button class="btn src-btn" id="backbtn" hidden></button>
        <p class="src-hint" id="src-hint"></p>
        <input type="file" id="folder" webkitdirectory directory multiple hidden>
      </div>
      <input class="field" id="q" type="search">
      <select class="field" id="tagf"></select>
      <div class="viewtabs" id="views" role="group">
        <button data-v="recent" aria-pressed="true"></button>
        <button data-v="vaak" aria-pressed="false"></button>
        <button data-v="az" aria-pressed="false"></button>
      </div>
      <select class="field" id="trkf"></select>
      <div class="summary" id="summary" aria-live="polite"></div>
    </div>
    <div class="carlist" id="carlist"></div>
  </aside>

  <div class="main">
    <div class="panel">
      <div class="bar">
        <span class="bar-label" id="l-selected"></span>
        <span class="hint" id="selhint"></span>
        <button class="btn" id="clearsel"></button>
      </div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="panel" id="ctrls" hidden>
      <div class="bar">
        <span class="bar-label" id="l-compare"></span>
        <span class="hint" id="refhint"></span>
        <button class="btn" id="clearrefs"></button>
        <button class="btn" id="tog" aria-pressed="false"></button>
        <button class="btn" id="force" aria-pressed="false" hidden></button>
        <span class="count" id="rowcount"></span>
      </div>
      <div class="warn" id="mixwarn" hidden></div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="scroller" id="scroller">
      <div class="empty" id="empty"><strong id="empty-t"></strong><span id="empty-b"></span></div>
      <table id="tbl" hidden><thead><tr id="hrow"></tr></thead><tbody id="tb"></tbody></table>
    </div>

    <div class="panel" id="pluk" hidden>
      <h2 id="l-pluck"></h2>
      <div class="bar">
        <span class="bar-label" id="l-startfrom"></span>
        <select class="btn" id="fill"></select>
        <button class="btn" id="clearpicks"></button>
        <button class="btn" id="copy"></button>
        <span class="count" id="count"></span>
      </div>
      <p class="hint" style="margin:0" id="pluckhint"></p>
      <div class="buildwrap"><table class="build" id="buildtbl"></table></div>
      <pre class="ini" id="out"></pre>
      <p class="hint" style="margin:0" id="savehint"></p>
    </div>

    <details class="about">
      <summary id="about-t"></summary>
      <ol id="about-list"></ol>
      <p class="about-note" id="about-note"></p>
    </details>

    <div class="panel" id="kit">
      <h2 id="kit-t"></h2>
      <p class="hint" style="margin:0" id="kit-b"></p>
      <ol class="ways" id="kit-ways"></ol>
      <pre class="ini" id="kit-prompt"></pre>
      <p class="hint" style="margin:0" id="kit-files-t"></p>
      <ul class="files" id="kit-files"></ul>
      <div class="bar"><button class="btn" id="kit-dl"></button><span class="count" id="kit-s"></span></div>
    </div>
  </div>
</div>

<script>
/*ACDATA*/

/* ============ languages ============ */
const LANGS = { en:"English", nl:"Nederlands", de:"Deutsch", es:"Español", fr:"Français" };

function t(key, ...a){
  let s = STR[lang][key];
  if (s === undefined) s = STR.en[key];
  if (s === undefined) return key;
  return String(s).replace(/\{(\d+)\}/g, (m, i) => a[i] !== undefined ? a[i] : m);
}

/* ============ labels and groups ============ */
const GKEYS = ["gAero","gTrans","gSusp","gDamp","gTyres","gDiff","gBrakes","gAids","gOther"];
function groupOf(base){
  if (/^WING/.test(base)) return "gAero";
  if (/^(FINAL_RATIO|INTERNAL_GEAR|GEAR)/.test(base)) return "gTrans";
  if (/^(ARB|SPRING_RATE|ROD_LENGTH|PACKER_RANGE|BUMP_STOP)/.test(base)) return "gSusp";
  if (/^DAMP/.test(base)) return "gDamp";
  if (/^(PRESSURE|CAMBER|TOE|TYRES)/.test(base)) return "gTyres";
  if (/^DIFF/.test(base)) return "gDiff";
  if (/^(FRONT_BIAS|BRAKE)/.test(base)) return "gBrakes";
  if (/^(ABS|TRACTION_CONTROL|ENGINE_LIMITER)/.test(base)) return "gAids";
  return "gOther";
}
function pretty(k){
  const s = k.replace(/_/g, " ").toLowerCase();
  return s.charAt(0).toUpperCase() + s.slice(1);
}
/* Setup files number the gears from INTERNAL_GEAR_2 up, so what the file calls
   gear 2 is the car's first gear. */
function ordinal(n){
  if (lang === "en"){ const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  if (lang === "nl") return n + "e";
  if (lang === "de") return n + ".";
  if (lang === "es") return n + "ª";
  if (lang === "fr") return n === 1 ? "1er" : n + "e";
  return String(n);
}
function labelFor(base, pos){
  let m;
  if ((m = base.match(/^INTERNAL_GEAR_(\d+)$/))){
    const g = parseInt(m[1], 10) - 1;
    return t("gear", ordinal(g >= 1 ? g : parseInt(m[1], 10)));
  }
  const dict = STR[lang].L || STR.en.L;
  if ((m = base.match(/^WING_(\d+)$/)) && !dict[base]) return t("wingN", m[1]);
  const l = dict[base] || STR.en.L[base] || pretty(base);
  const suf = pos ? t("p" + pos) : "";
  return l + (suf === "p" + pos ? "" : suf);
}

function rank(base){
  for (let i = 0; i < ORDER.length; i++) if (base.startsWith(ORDER[i])) return i;

}

/* ============ reading your own folder ============ */
/* The built-in data doubles as an id-to-name dictionary. Someone loading their
   own folder has no AC install at hand, but shares most car ids with it — so
   they still get proper names for anything this library already knows. */
const KNOWN_CAR = {}; AC_DATA.cars.forEach(c => KNOWN_CAR[c.id] = c);
const KNOWN_TRACK = Object.assign({}, AC_DATA.tracks);

function prettyId(id){
  return id.replace(/^ks_/, "").replace(/[_-]+/g, " ").replace(/\b\w/g, m => m.toUpperCase());
}
function parseIni(text){
  const v = {}; let sec = null, model = null, m;
  for (const raw of text.split(/\r?\n/)){
    const line = raw.trim();
    if ((m = line.match(/^\[(.+?)\]$/))){ sec = m[1]; continue; }
    if (!sec) continue;
    if ((m = line.match(/^VALUE\s*=\s*(.*)$/))){ v[sec] = m[1].trim(); continue; }
    if (sec === "CAR" && (m = line.match(/^MODEL\s*=\s*(.*)$/))) model = m[1].trim();
  }
  return { v, model };
}
function isoDay(ms){
  const d = new Date(ms);
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
async function readFolder(fileList){
  const files = [...fileList].filter(f => /\.ini$/i.test(f.name) && !/^server_temp/i.test(f.name));
  const carsMap = new Map(), tracks = {};
  for (const f of files){
    let text;
    try { text = await f.text(); } catch (e) { continue; }
    const { v, model } = parseIni(text);
    if (Object.keys(v).length === 0) continue;

    const rel = (f.webkitRelativePath || f.name).split(/[\/\\]/).filter(Boolean);
    let carId = null, trackId = "generic";
    if (rel.length >= 3 && rel[rel.length - 3].toLowerCase() !== "setups"){
      carId = rel[rel.length - 3]; trackId = rel[rel.length - 2];
    } else if (rel.length >= 2){
      carId = model || rel[rel.length - 2]; trackId = rel[rel.length - 2];
    } else {
      carId = model;
    }
    if (!carId) continue;

    if (!carsMap.has(carId)){
      const k = KNOWN_CAR[carId];
      carsMap.set(carId, {
        id: carId, name: k ? k.name : prettyId(carId), brand: k ? k.brand : "",
        tags: k ? k.tags : [], bhp: k ? k.bhp : "", kg: k ? k.kg : "", setups: []
      });
    }
    if (tracks[trackId] === undefined) tracks[trackId] = KNOWN_TRACK[trackId] ?? (trackId === "generic" ? "" : prettyId(trackId));
    carsMap.get(carId).setups.push({
      n: f.name.replace(/\.ini$/i, ""), t: trackId, d: isoDay(f.lastModified),
      a: /^last\.ini$/i.test(f.name), v
    });
  }
  const cars = [...carsMap.values()].sort((a, b) => a.name.localeCompare(b.name));
  cars.forEach(c => c.setups.sort((a, b) => a.t.localeCompare(b.t) || a.n.localeCompare(b.n)));
  return { generated: isoDay(Date.now()), tracks, cars };
}

/* The two filters count each other: pick a class and the track list reports how
   many cars of that class have setups there, and the other way round. */
function refreshFacets(q, tag, trk){
  const hitQ = c => !q || (c.name + " " + c.brand + " " + c.id).toLowerCase().includes(q);
  [...tagf.options].forEach(o => {
    if (!o.value){ o.textContent = t("allClasses"); return; }
    const n = CARS.filter(c => (c.tags || []).includes(o.value) && hitQ(c) &&
      (!trk || c.setups.some(s => s.t === trk))).length;
    o.textContent = o.dataset.lbl + " (" + n + ")";
    o.hidden = o.disabled = (n === 0 && o.value !== tag);
  });
  [...trkf.options].forEach(o => {
    if (!o.value){ o.textContent = t("allTracks"); return; }
    const n = CARS.filter(c => c.setups.some(s => s.t === o.value) && hitQ(c) &&
      (!tag || (c.tags || []).includes(tag))).length;
    o.textContent = o.dataset.lbl + " (" + t("carsN", n) + ")";
    o.hidden = o.disabled = (n === 0 && o.value !== trk);
  });
}

function renderCars(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const tag = tagf.value, trk = trkf.value;
  refreshFacets(q, tag, trk);
  const filtered = CARS.filter(c =>
    (!tag || (c.tags || []).includes(tag)) &&
    (!trk || c.setups.some(s => s.t === trk)) &&
    (!q || (c.name + " " + c.brand + " " + c.id).toLowerCase().includes(q)));

  const stat = c => {
    if (!trk) return { last:c._last, days:c._days, n:c.setups.length };
    const mine = c.setups.filter(s => s.t === trk);
    return { last: mine.reduce((m,s) => s.d > m ? s.d : m, ""), days: new Set(mine.map(s => s.d)).size, n: mine.length };
  };
  const sorters = {
    recent: (a,b) => (stat(b).last > stat(a).last ? 1 : stat(b).last < stat(a).last ? -1 : 0) || a.name.localeCompare(b.name),
    vaak:   (a,b) => stat(b).days - stat(a).days || stat(b).n - stat(a).n || a.name.localeCompare(b.name),
    az:     (a,b) => a.name.localeCompare(b.name)
  };
  const sorted = [...filtered].sort(sorters[view]);

  const narrowed = q !== "" || tag !== "" || trk !== "";
  const pins = sorted.filter(c => pinned.has(c.id));
  const rest = sorted.filter(c => !pinned.has(c.id));
  const capped = (view !== "az" && !narrowed) ? rest.slice(0, 12) : rest;

  let html = "";
  if (pins.length) html += '<div class="sect">' + esc(t("pinned")) + '</div>' + pins.map(carHtml).join("");
  if (rest.length){
    const where = trk ? t("onTrack", trackName(trk)) : "";
    const head = view === "recent" ? (narrowed ? t("hRecent", where, rest.length) : t("hRecentTop"))
               : view === "vaak"   ? (narrowed ? t("hOften",  where, rest.length) : t("hOftenTop"))
               : t("hAll", where, rest.length);
    html += '<div class="sect">' + esc(head) + '</div>' + capped.map(carHtml).join("");
    if (capped.length < rest.length)
      html += '<div class="sect note">' + esc(t("more", rest.length - capped.length)) + '</div>';
  }
  /* Keep the scroll position: this list is rebuilt on every tick, and 140 cars
     is a long way to fall back to the top. */
  const listEl = document.getElementById("carlist");
  const keepScroll = listEl.scrollTop;
  listEl.innerHTML = html || '<div class="empty" style="padding:24px">' + esc(t("noCars")) + '</div>';
  listEl.scrollTop = keepScroll;

  const shown = filtered.reduce((n,c) => n + (trk ? c.setups.filter(s => s.t === trk).length : c.setups.length), 0);
  document.getElementById("summary").innerHTML = narrowed
    ? t("summaryNarrow", '<b class="narrow">' + filtered.length + '</b>', CARS.length,
                         '<b class="narrow">' + shown + '</b>', totalSetups)
    : t("summaryAll", CARS.length, totalSetups);
}

/* ============ rows ============ */
function splitKey(k){
  let m;
  if ((m = k.match(/^(.*)_(LF|RF)$/))) return [m[1], "F"];
  if ((m = k.match(/^(.*)_(LR|RR)$/))) return [m[1], "R"];
  if ((m = k.match(/^(.*)_(HF)$/)))    return [m[1], "HF"];
  if ((m = k.match(/^(.*)_(HR)$/)))    return [m[1], "HR"];
  return [k, ""];
}
function buildRows(){
  const rows = new Map();
  cols.forEach(col => {
    const v = setupOf(col).v;
    for (const k in v){
      const [base, pos] = splitKey(k);
      const id = base + "|" + pos;
      if (!rows.has(id)) rows.set(id, { id, base, pos, keys:new Set(), g:groupOf(base), l:labelFor(base, pos) });
      rows.get(id).keys.add(k);
    }
  });
  const arr = [...rows.values()];
  arr.forEach(r => r.keys = [...r.keys].sort());
  arr.sort((a,b) =>
    GKEYS.indexOf(a.g) - GKEYS.indexOf(b.g) ||
    rank(a.base) - rank(b.base) ||
    a.base.localeCompare(b.base) ||
    (POSRANK[a.pos] ?? 9) - (POSRANK[b.pos] ?? 9));
  return arr;
}
function cellValue(row, col){
  const v = setupOf(col).v;
  const vals = row.keys.map(k => v[k]).filter(x => x !== undefined);
  return vals.length === 0 ? null : [...new Set(vals)].join("/");
}

/* ============ click positions to real values ============ */
/* Setup files store a click position for most settings: the real value is
   MIN + click * STEP. A few settings instead store the value itself on a finer
   scale than MIN and MAX are written in - camber holds tenths of a degree. Which
   of the two applies is decided per setting by seeing which one lands inside the
   range the car actually allows. */
function fmtNum(x){
  const r = Math.round(x * 100) / 100;
  return Number.isInteger(r) ? String(r) : r.toFixed(Math.abs(r) < 10 ? 2 : 1).replace(/0$/, "");
}
function convert(car, key, raw){
  const m = car.m; if (!m) return null;
  const n = parseFloat(raw); if (isNaN(n)) return null;

  if (m.g && m.g[key]){
    const row = m.g[key][Math.round(n)];
    if (!row) return null;
    const bits = String(row).split("|");
    const ratio = parseFloat(bits[bits.length - 1]);
    const teeth = bits.length > 1 ? bits[0].replace("//", "/") : "";
    if (isNaN(ratio)) return null;
    return { txt: ratio.toFixed(3) + (teeth ? " · " + teeth : ""), max: m.g[key].length - 1, min: 0, step: 1 };
  }
  if (key === "TYRES" && m.c && m.c.length){
    const c = m.c[Math.round(n)];
    if (!c) return null;
    return { txt: c.n + (c.s ? " (" + c.s + ")" : ""), min: 0, max: m.c.length - 1, step: 1 };
  }
  const r = m.r && m.r[key]; if (!r) return null;
  const clicks = Math.round((r.mx - r.mn) / r.st);
  let val = null, min = 0, max = clicks;
  if (n >= 0 && n <= clicks){
    val = r.mn + n * r.st;
  } else {
    for (const f of [10, 100, 1]){
      if (n / f >= r.mn && n / f <= r.mx){ val = n / f; min = r.mn * f; max = r.mx * f; break; }
    }
    if (val === null) return null;
  }
  let txt = fmtNum(val);
  if (/^PRESSURE/.test(key)) txt += " psi · " + (val * 0.0689476).toFixed(2) + " bar";
  else if (key === "FUEL") txt += " L";
  else if (/^CAMBER/.test(key)) txt += "°";
  return { txt, min, max, step: 1 };
}
/* The display string for a cell; falls back to the click position. */
function cellText(row, col, raw){
  if (raw === null) return null;
  if (row.keys.length === 1 && !raw.includes("/")){
    const c = convert(byId[col.car], row.keys[0], raw);
    if (c) return c.txt;
  }
  return raw;
}

/* ============ real values from the car data ============ */
const PSI_TO_BAR = 0.0689476;
function fmtNum(v){
  if (!isFinite(v)) return String(v);
  const r = Math.round(v * 1000) / 1000;
  return Math.abs(r - Math.round(r)) < 1e-9 ? String(Math.round(r)) : String(r);
}

/* A setup file stores either a click position or the value itself on a finer
   scale. Which of the two follows from the range in the car data, so work it
   out per setting rather than applying one rule to everything. */
function scaleOf(r, n){
  const clicks = Math.round((r.mx - r.mn) / r.st);
  if (n >= 0 && n <= clicks) return { val: r.mn + n * r.st, lo: 0, hi: clicks };
  for (const f of [10, 100]){
    const c = n / f;
    if (c >= r.mn && c <= r.mx) return { val: c, lo: Math.round(r.mn * f), hi: Math.round(r.mx * f) };
  }
  return null;
}

function realOne(car, key, raw){
  const m = car.m; if (!m) return null;
  const n = parseFloat(raw); if (isNaN(n)) return null;

  if (m.g && m.g[key]){
    const row = m.g[key][Math.round(n)];
    if (!row) return null;
    const p = String(row).split("|");
    const ratio = parseFloat(p[1]);
    return isNaN(ratio) ? p[0] : ratio.toFixed(3) + " · " + p[0].replace("//", "/");
  }
  if (key === "TYRES" && m.c && m.c.length){
    const c = m.c[Math.round(n)];
    return c ? c.n + (c.s ? " (" + c.s + ")" : "") : null;
  }
  const r = m.r && m.r[key]; if (!r) return null;
  const s = scaleOf(r, n); if (!s) return null;

  if (/^PRESSURE/.test(key)) return fmtNum(s.val) + " psi · " + (s.val * PSI_TO_BAR).toFixed(2) + " bar";
  if (key === "FUEL") return fmtNum(s.val) + " L";
  if (/^CAMBER/.test(key)) return fmtNum(s.val) + "°";
  return fmtNum(s.val);
}

/* Grenzen waarbinnen een waarde in de builder mag bewegen. */
function boundsOf(car, key, raw){
  const m = car.m; if (!m) return null;
  const n = parseFloat(raw); if (isNaN(n)) return null;
  if (m.g && m.g[key]) return { lo: 0, hi: m.g[key].length - 1 };
  if (key === "TYRES" && m.c && m.c.length) return { lo: 0, hi: m.c.length - 1 };
  const r = m.r && m.r[key]; if (!r) return null;
  const s = scaleOf(r, n); if (!s) return null;
  return { lo: s.lo, hi: s.hi };
}

/* Displayed text for a cell: the real value where the car data allows it,
   otherwise the raw number straight from the file. */
function cellText(row, col, raw){
  if (raw === null) return null;
  const car = byId[col.car];
  const parts = String(raw).split("/");
  const out = parts.map((p, i) => realOne(car, row.keys[Math.min(i, row.keys.length - 1)], p) || p);
  return [...new Set(out)].join(" / ");
}
function hasReal(row, col, raw){
  if (raw === null) return false;
  return realOne(byId[col.car], row.keys[0], String(raw).split("/")[0]) !== null;
}

/* ============ colouring ============ */
const num = s => { const m = String(s).match(/-?\d+/); return m ? parseInt(m[0], 10) : null; };
function mixedCars(){ return new Set(cols.map(c => c.car)).size > 1; }
function coloring(){ return refs.length > 0 && (!mixedCars() || forceColor); }
function cls(vals, i){
  if (!coloring() || refs.includes(i)) return "";
  const x = num(vals[i]); if (x === null) return "";
  if (refs.length === 1){
    const a = num(vals[refs[0]]);
    if (a === null || x === a) return "";
    return x > a ? "warm" : "cool";
  }
  const a = num(vals[refs[0]]), b = num(vals[refs[1]]);
  if (a === null || b === null || a === b) return "";
  if (x === a) return "cool";
  if (x === b) return "warm";
  const lo = Math.min(a,b), hi = Math.max(a,b);
  return (x > lo && x < hi) ? "mid" : "out";
}

let ROWS = [];
function renderBody(){
  ROWS = buildRows();
  let html = "", grp = null, shown = 0;
  ROWS.forEach(r => {
    const vals = cols.map(c => cellValue(r, c));
    const same = vals.every(v => v === vals[0]);
    if (onlyDiff && same) return;
    shown++;
    if (r.g !== grp){
      grp = r.g;
      html += '<tr class="grp"><td class="pname">' + esc(t(grp)) + '</td><td colspan="' + cols.length + '"></td></tr>';
    }
    html += '<tr><td class="pname" title="' + esc(r.keys.join(", ")) + '">' + esc(r.l) + '</td>' +
      vals.map((v,i) => {
        if (v === null) return '<td class="na">&mdash;</td>';
        const c = ["val", cls(vals, i)];
        if (picks[r.id] === i) c.push("picked");
        const shown = cellText(r, cols[i], v);
        const extra = shown !== v ? '<span class="click">' + esc(v) + '</span>' : "";
        return '<td class="' + c.join(" ") + '" data-row="' + esc(r.id) + '" data-i="' + i +
          '" title="' + esc(r.keys.join(", ") + " = " + v) + '">' +
          (extra ? '<span class="real">' + esc(shown) + '</span>' + extra : esc(shown)) + '</td>';
      }).join("") + '</tr>';
  });
  document.getElementById("tb").innerHTML = html;
  document.getElementById("rowcount").textContent = t("rows", shown, ROWS.length);
}

/* The value a picked row currently holds: what you clicked, unless you have
   since nudged or typed something else. */
function pickedRaw(row){
  if (edits[row.id] !== undefined) return String(edits[row.id]);
  const ci = picks[row.id];
  if (ci === undefined || !cols[ci]) return null;
  return cellValue(row, cols[ci]);
}
function boundsFor(row){
  const ci = picks[row.id];
  if (ci === undefined || !cols[ci]) return null;
  const raw = cellValue(row, cols[ci]);
  if (raw === null || row.keys.length !== 1 || raw.includes("/")) return null;
  return convert(byId[cols[ci].car], row.keys[0], raw);
}

function renderBuild(){
  const tbl = document.getElementById("buildtbl");
  if (ROWS.length === 0){ tbl.innerHTML = ""; return; }
  let html = '<thead><tr><th>' + esc(t("colSetting")) + '</th><th>' + esc(t("bValue")) +
    '</th><th>' + esc(t("bSource")) + '</th></tr></thead><tbody>';
  ROWS.forEach(r => {
    const ci = picks[r.id];
    if (ci === undefined){
      html += '<tr class="open"><td class="b-name">' + esc(r.l) + '</td><td class="b-val">&mdash;</td>' +
        '<td class="b-src">' + esc(t("bNotPicked")) + '</td></tr>';
      return;
    }
    const raw = pickedRaw(r), b = boundsFor(r);
    const car = byId[cols[ci].car];
    const shown = (r.keys.length === 1 && !String(raw).includes("/") && convert(car, r.keys[0], raw))
      ? convert(car, r.keys[0], raw).txt : raw;
    const nRaw = parseFloat(raw);
    const canStep = b && !isNaN(nRaw);
    const dis = (d) => canStep && ((d < 0 && nRaw <= b.min) || (d > 0 && nRaw >= b.max)) ? " disabled" : "";
    const cell = canStep
      ? '<span class="stepper">' +
        '<button data-brow="' + esc(r.id) + '" data-d="-1"' + dis(-1) + ' aria-label="&minus;">&minus;</button>' +
        '<input type="text" inputmode="numeric" data-brow="' + esc(r.id) + '" value="' + esc(raw) + '">' +
        '<button data-brow="' + esc(r.id) + '" data-d="1"' + dis(1) + ' aria-label="+">+</button></span> ' +
        '<span class="' + (edits[r.id] !== undefined ? "edited" : "") + '">' + esc(shown) + '</span>'
      : '<span class="stepper"><input type="text" inputmode="numeric" data-brow="' + esc(r.id) + '" value="' + esc(raw) + '"></span> ' +
        '<span class="' + (edits[r.id] !== undefined ? "edited" : "") + '">' + esc(shown) + '</span>';
    html += '<tr><td class="b-name">' + esc(r.l) + '</td><td class="b-val">' + cell + '</td>' +
      '<td class="b-src" title="' + esc(car.name + " — " + setupOf(cols[ci]).n) + '">' +
      esc(setupOf(cols[ci]).n) + '</td></tr>';
  });
  tbl.innerHTML = html + '</tbody>';
}

function nudge(rowId, d){
  const r = ROWS.find(x => x.id === rowId); if (!r) return;
  const b = boundsFor(r); const cur = parseFloat(pickedRaw(r));
  if (isNaN(cur)) return;
  let next = cur + d * ((b && b.step) || 1);
  if (b){ next = Math.max(b.min, Math.min(b.max, next)); }
  edits[rowId] = next;
  renderBuild(); buildIni();
}
function setRaw(rowId, txt){
  const r = ROWS.find(x => x.id === rowId); if (!r) return;
  let v = parseFloat(txt);
  if (isNaN(v)) { renderBuild(); return; }
  const b = boundsFor(r);
  v = Math.round(v);
  if (b){ v = Math.max(b.min, Math.min(b.max, v)); }
  edits[rowId] = v;
  renderBuild(); buildIni();
}

function buildIni(){
  const ids = Object.keys(picks);
  const rowById = {}; ROWS.forEach(r => rowById[r.id] = r);
  const lines = [], usedCars = new Set();
  ids.forEach(id => {
    const r = rowById[id], ci = picks[id];
    if (!r || !cols[ci]) return;
    const v = setupOf(cols[ci]).v;
    usedCars.add(cols[ci].car);
    const override = edits[id];
    r.keys.forEach(k => {
      if (v[k] === undefined) return;
      lines.push([k, override !== undefined ? String(override) : v[k]]);
    });
  });
  const out = document.getElementById("out");
  document.getElementById("count").innerHTML = t("picked", ids.length, ROWS.length);
  if (lines.length === 0){ out.textContent = t("pluckEmpty"); return; }
  const model = cols[picks[ids[0]]] ? cols[picks[ids[0]]].car : "";
  lines.push(["CAR", null]);
  lines.sort((a,b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
  let txt = "";
  if (usedCars.size > 1){
    txt += t("iniMix1", usedCars.size, [...usedCars].map(c => byId[c].name).join(", ")) + "\n" +
           t("iniMix2") + "\n\n";
  }
  for (const [k,v] of lines) txt += "[" + k + "]\n" + (k === "CAR" ? "MODEL=" + model : "VALUE=" + v) + "\n\n";
  txt += "[__EXT_PATCH]\nVERSION=0.2.9\n";
  out.textContent = txt;
}

function renderFill(){
  document.getElementById("fill").innerHTML = '<option value="">' + esc(t("chooseSetup")) + '</option>' +
    cols.map((c,i) => '<option value="' + i + '">' + esc(byId[c.car].name + " — " + setupOf(c).n) + '</option>').join("");
}
function renderAll(){ renderCars(); renderChips(); renderControls(); renderHead(); renderBody(); renderFill(); renderBuild(); buildIni(); }

/* ============ controls ============ */
function removeCol(at){
  cols.splice(at, 1);
  refs = refs.filter(r => r !== at).map(r => r > at ? r - 1 : r);
  const np = {};
  for (const k in picks){ const v = picks[k]; if (v === at) continue; np[k] = v > at ? v - 1 : v; }
  picks = np;
}
function toggleRef(i){
  const at = refs.indexOf(i);
  if (at > -1) refs.splice(at, 1);
  else { refs.push(i); if (refs.length > 2) refs.shift(); }
  renderControls(); renderHead(); renderBody();
  /* renderHead replaces the header cells, so put focus back where it was. */
  const again = document.querySelector('th.col[data-i="' + i + '"]');
  if (again && document.activeElement === document.body) again.focus();
}

langSel.addEventListener("change", () => {
  lang = langSel.value; saveLang(); applyStatic(); renderAll();
});
document.getElementById("q").addEventListener("input", renderCars);
tagf.addEventListener("change", renderCars);
trkf.addEventListener("change", renderCars);
document.getElementById("views").addEventListener("click", e => {
  const b = e.target.closest("button[data-v]"); if (!b) return;
  view = b.dataset.v;
  [...e.currentTarget.querySelectorAll("button")].forEach(x =>
    x.setAttribute("aria-pressed", x.dataset.v === view ? "true" : "false"));
  renderCars();
});
document.getElementById("carlist").addEventListener("click", e => {
  const pin = e.target.closest("button[data-pin]");
  if (pin){ const id = pin.dataset.pin; pinned.has(id) ? pinned.delete(id) : pinned.add(id); savePins(); renderCars(); return; }
  const head = e.target.closest(".car-head");
  if (head){ const id = head.dataset.car; openCars.has(id) ? openCars.delete(id) : openCars.add(id); renderCars(); return; }
  const same = e.target.closest(".samecls");
  if (same){ tagf.value = same.dataset.tag; renderCars(); }
});
document.getElementById("carlist").addEventListener("change", e => {
  const cb = e.target.closest("input[type=checkbox]"); if (!cb) return;
  const car = cb.dataset.car, si = parseInt(cb.dataset.si, 10);
  const at = cols.findIndex(x => x.car === car && x.si === si);
  if (cb.checked && at === -1) cols.push({ car, si });
  else if (!cb.checked && at > -1) removeCol(at);
  renderAll();
});
document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest("button[data-at]"); if (!b) return;
  removeCol(parseInt(b.dataset.at, 10)); renderAll();
});
document.getElementById("hrow").addEventListener("click", e => {
  const th = e.target.closest("th.col"); if (th) toggleRef(parseInt(th.dataset.i, 10));
});
document.getElementById("hrow").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const th = e.target.closest("th.col"); if (!th) return;
  e.preventDefault(); toggleRef(parseInt(th.dataset.i, 10));
});
document.getElementById("tb").addEventListener("click", e => {
  const td = e.target.closest("td.val"); if (!td) return;
  const id = td.dataset.row, ci = parseInt(td.dataset.i, 10);
  if (picks[id] === ci) { delete picks[id]; delete edits[id]; } else { picks[id] = ci; delete edits[id]; }
  renderBody(); renderBuild(); buildIni();
});
document.getElementById("fill").addEventListener("change", e => {
  if (e.target.value === "") return;
  const ci = parseInt(e.target.value, 10);
  ROWS.forEach(r => { if (cellValue(r, cols[ci]) !== null) { picks[r.id] = ci; delete edits[r.id]; } });
  e.target.value = "";
  renderBody(); renderBuild(); buildIni();
});
document.getElementById("clearpicks").addEventListener("click", () => { picks = {}; edits = {}; renderBody(); renderBuild(); buildIni(); });
document.getElementById("clearrefs").addEventListener("click", () => { refs = []; renderControls(); renderHead(); renderBody(); });
document.getElementById("clearsel").addEventListener("click", () => { cols = []; refs = []; picks = {}; edits = {}; renderAll(); });

document.getElementById("buildtbl").addEventListener("click", e => {
  const b = e.target.closest("button[data-brow]"); if (!b) return;
  nudge(b.dataset.brow, parseInt(b.dataset.d, 10));
});
document.getElementById("buildtbl").addEventListener("change", e => {
  const i = e.target.closest("input[data-brow]"); if (!i) return;
  setRaw(i.dataset.brow, i.value);
});
document.getElementById("buildtbl").addEventListener("keydown", e => {
  const i = e.target.closest("input[data-brow]"); if (!i) return;
  if (e.key === "Enter") { e.preventDefault(); setRaw(i.dataset.brow, i.value); }
  else if (e.key === "ArrowUp") { e.preventDefault(); nudge(i.dataset.brow, 1); }
  else if (e.key === "ArrowDown") { e.preventDefault(); nudge(i.dataset.brow, -1); }
});
document.getElementById("tog").addEventListener("click", e => {
  onlyDiff = !onlyDiff; e.currentTarget.setAttribute("aria-pressed", onlyDiff ? "true" : "false"); renderBody();
});
document.getElementById("force").addEventListener("click", () => { forceColor = !forceColor; renderControls(); renderBody(); });
document.getElementById("copy").addEventListener("click", async e => {
  const btn = e.currentTarget;
  try { await navigator.clipboard.writeText(document.getElementById("out").textContent); btn.textContent = t("copied"); }
  catch { btn.textContent = t("selectBelow"); }
  setTimeout(() => { btn.textContent = t("copyIni"); }, 1800);
});

document.getElementById("loadbtn").addEventListener("click", () => document.getElementById("folder").click());
document.getElementById("folder").addEventListener("change", async e => {
  const btn = document.getElementById("loadbtn"), hint = document.getElementById("src-hint");
  btn.textContent = t("srcReading");
  let d = null;
  try { d = await readFolder(e.target.files); } catch (err) { d = null; }
  e.target.value = "";
  if (!d || d.cars.length === 0){ hint.textContent = t("srcNone"); btn.textContent = t("loadFolder"); return; }
  ownData = d; setData(d); applyStatic(); renderAll();
});
document.getElementById("backbtn").addEventListener("click", () => {
  ownData = null; setData(AC_DATA); applyStatic(); renderAll();
});

setData(AC_DATA);
/* The package itself travels as a zip; a page cannot hand over files on a
   publicly shared link. All this button does is copy the one line you paste
   into Claude Code. */
(function(){
  const btn = document.getElementById("kit-dl"), note = document.getElementById("kit-s");
  btn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(document.getElementById("kit-prompt").textContent);
      note.textContent = t("kitCopied");
    } catch (e) {
      note.textContent = t("kitNo");
    }
    setTimeout(() => { note.textContent = ""; }, 3000);
  });
})();

applyStatic();
renderAll();
</script>
